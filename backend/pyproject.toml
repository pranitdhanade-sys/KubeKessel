[project]
name = "k8s-monitor-agent"
version = "0.1.0"
description = "Smart Kubernetes Monitoring Assistant backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "kubernetes-asyncio>=30.3",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "structlog>=24.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
